name: Build native Nintendo Switch NRO

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nro:
    name: Compile native SDL2 launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native DeskNX NRO
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DEVKITPRO=/opt/devkitpro \
            -e DEVKITA64=/opt/devkitpro/devkitA64 \
            devkitpro/devkita64:latest \
            bash -lc 'dkp-pacman -S --noconfirm switch-sdl2 switch-sdl2_image switch-sdl2_ttf && make -j2 -f Makefile.switch'

      - name: Upload native NRO
        uses: actions/upload-artifact@v4
        with:
          name: transwitch-native-nro
          path: |
            DeskNX.nro
            desknx.nro
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DeskNX.nro
            desknx.nro
          generate_release_notes: true
          name: "Transwitch Nintendo Switch ${{ github.ref_name }}"
