name: Build Nintendo Switch NRO

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nro:
    name: Compile & Package native DeskNX.nro
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository hygiene
        run: bash scripts/check-repo-hygiene.sh

      - name: Verify native standalone entry point
        run: bash scripts/check-standalone-entrypoint.sh

      - name: Build native SDL2 NRO
        env:
          DEVKITPRO: /opt/devkitpro
        run: make -j2

      - name: Verify NRO metadata and absence of RomFS
        run: python3 scripts/check-nro-assets.py DeskNX.nro

      - name: Upload native NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: desknx-switch-nro
          path: DeskNX.nro
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DeskNX.nro
          generate_release_notes: true
          name: "DeskNX Nintendo Switch ${{ github.ref_name }}"
