name: Build Nextendo Online Overlay

on:
  push:
    branches: [main, master, feature/nextendo-online-overlay]
    paths:
      - 'overlays/NextendoOnline/**'
      - '.github/workflows/build-nextendo-overlay.yml'
  pull_request:
    paths:
      - 'overlays/NextendoOnline/**'
      - '.github/workflows/build-nextendo-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone Nextendo Tesla overlay
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - name: Checkout Transwitch
        uses: actions/checkout@v4

      - name: Install Switch toolchain and portlibs
        run: dkp-pacman -S --needed --noconfirm switch-dev switch-portlibs

      - name: Fetch libtesla headers
        run: |
          git clone --depth 1 https://github.com/Doutea/Nextendo-status-ovl.git /tmp/nextendo-status-ovl
          mkdir -p overlays/NextendoOnline/libs
          cp -R /tmp/nextendo-status-ovl/libs/libtesla overlays/NextendoOnline/libs/libtesla
          python3 overlays/NextendoOnline/scripts/patch-libtesla-gcc15.py overlays/NextendoOnline/libs/libtesla/include/tesla.hpp

      - name: Run host parser tests
        working-directory: overlays/NextendoOnline
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/parser_test.cpp -o /tmp/nextendo-overlay-parser-test
          /tmp/nextendo-overlay-parser-test

      - name: Build overlay NRO
        working-directory: overlays/NextendoOnline
        run: |
          make clean
          make -j2
          test -s nextendo-online.nro
          magic="$(dd if=nextendo-online.nro bs=1 skip=16 count=4 2>/dev/null)"
          test "$magic" = "NRO0"
          cp nextendo-online.nro nextendo-online.ovl

      - name: Prepare artifact with license
        working-directory: overlays/NextendoOnline
        run: |
          mkdir -p dist
          cp nextendo-online.ovl README.md dist/
          cp libs/libtesla/LICENSE dist/LICENSE-GPL-2

      - name: Upload Tesla overlay
        uses: actions/upload-artifact@v4
        with:
          name: NextendoOnline-ovl
          path: overlays/NextendoOnline/dist/
          if-no-files-found: error
          retention-days: 30
