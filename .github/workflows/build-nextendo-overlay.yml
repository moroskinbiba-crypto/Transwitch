name: Build Nextendo Online Overlay

on:
  push:
    branches: [main, master, feature/nextendo-online-overlay]
    paths:
      - 'overlays/NextendoOnline/**'
      - '.github/workflows/build-nextendo-overlay.yml'
  pull_request:
    paths:
      - 'overlays/NextendoOnline/**'
      - '.github/workflows/build-nextendo-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone Nextendo Tesla overlay
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:20260219@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BUILD_CONTAINER_REF: devkitpro/devkita64:20260219@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
      CHECKOUT_ACTION_REF: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      UPLOAD_ARTIFACT_ACTION_REF: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      LIBTESLA_REF: f633c33875dc43ad0091450c2535ac41f796b512
    steps:
      - name: Checkout Transwitch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set source date epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Verify pinned Switch toolchain and portlib packages
        run: |
          pacman -Q libnx switch-curl switch-libsodium switch-sdl2 switch-sdl2_image switch-sdl2_ttf
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++

      - name: Fetch libtesla headers at a fixed commit
        run: |
          git clone --no-checkout https://github.com/Doutea/Nextendo-status-ovl.git /tmp/nextendo-status-ovl
          git -C /tmp/nextendo-status-ovl fetch --depth=1 origin "$LIBTESLA_REF"
          git -C /tmp/nextendo-status-ovl checkout --detach FETCH_HEAD
          LIBTESLA_RESOLVED_COMMIT="$(git -C /tmp/nextendo-status-ovl rev-parse HEAD)"
          test "$LIBTESLA_RESOLVED_COMMIT" = "$LIBTESLA_REF"
          echo "THIRD_PARTY_RESOLVED_COMMIT=$LIBTESLA_RESOLVED_COMMIT" >> "$GITHUB_ENV"
          mkdir -p overlays/NextendoOnline/libs
          cp -R /tmp/nextendo-status-ovl/libs/libtesla overlays/NextendoOnline/libs/libtesla
          python3 overlays/NextendoOnline/scripts/patch-libtesla-gcc15.py overlays/NextendoOnline/libs/libtesla/include/tesla.hpp

      - name: Validate provenance scripts
        run: |
          bash -n scripts/write-build-manifest.sh scripts/write-package-checksums.sh tests/test-build-provenance.sh
          bash tests/test-build-provenance.sh

      - name: Run host parser tests
        working-directory: overlays/NextendoOnline
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/parser_test.cpp -o /tmp/nextendo-overlay-parser-test
          /tmp/nextendo-overlay-parser-test

      - name: Build overlay NRO
        working-directory: overlays/NextendoOnline
        run: |
          make clean
          make -j2
          test -s nextendo-online.nro
          magic="$(dd if=nextendo-online.nro bs=1 skip=16 count=4 2>/dev/null)"
          test "$magic" = "NRO0"
          cp nextendo-online.nro nextendo-online.ovl

      - name: Prepare artifact with license
        working-directory: overlays/NextendoOnline
        run: |
          mkdir -p dist
          cp nextendo-online.ovl README.md dist/
          cp libs/libtesla/LICENSE dist/LICENSE-GPL-2
          BUILD_TARGET=nextendo-online-overlay THIRD_PARTY_SOURCE=Doutea/Nextendo-status-ovl THIRD_PARTY_REF="$LIBTESLA_REF" bash ../../scripts/write-build-manifest.sh dist/BUILD-MANIFEST.txt
          bash ../../scripts/write-package-checksums.sh dist

      - name: Upload Tesla overlay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NextendoOnline-ovl
          path: overlays/NextendoOnline/dist/
          if-no-files-found: error
          retention-days: 30
