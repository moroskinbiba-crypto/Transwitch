name: Build DeskNX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build native DeskNX NRO and HOME applet
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository hygiene
        run: bash scripts/check-repo-hygiene.sh

      - name: Verify production HOME applet entry point
        run: bash scripts/check-home-applet-entrypoint.sh

      - name: Verify Switch curl dependency
        run: test -s /opt/devkitpro/portlibs/switch/lib/libcurl.a

      - name: Validate shell scripts
        run: bash -n scripts/install-system.sh scripts/uninstall-system.sh scripts/package-runtime-assets.sh tests/test-recovery.sh

      - name: Run host model, layout and catalog-view unit tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Iprojects/common/include tests/model_test.cpp source/Layout.cpp source/catalog_view.cpp -o /tmp/desknx-model-test
          /tmp/desknx-model-test

      - name: Install host zlib headers for NACP normalization test
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zlib1g-dev

      - name: Test compressed NACP title normalization
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tests/nacp_title_block_test.cpp -lz -o /tmp/desknx-nacp-test
          /tmp/desknx-nacp-test

      - name: Test IPC protocol validation boundaries
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tests/protocol_rules_test.cpp -o /tmp/desknx-protocol-rules-test
          /tmp/desknx-protocol-rules-test

      - name: Test production menu liveness controller
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iprojects/common/include tests/menu_liveness_test.cpp -o /tmp/desknx-menu-liveness-test
          /tmp/desknx-menu-liveness-test

      - name: Run host IPC parser tests (ТЗ IPC-01/02/04/07)
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Iprojects/common/include \
            tests/protocol_parser_test.cpp source/ProtocolParser.cpp \
            -o /tmp/desknx-protocol-parser-test
          /tmp/desknx-protocol-parser-test

      - name: Run host backend state-machine tests (ТЗ §3.2/§3.3)
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iprojects/common/include \
            tests/backend_machine_test.cpp projects/common/source/BackendMachine.cpp \
            -o /tmp/desknx-backend-machine-test
          /tmp/desknx-backend-machine-test

      - name: Test install and recovery logic on a temporary fake SD card
        run: bash tests/test-recovery.sh

      - name: Test confirmation dialog layout and hit-target geometry
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/confirmation_dialog_layout_test.cpp -o /tmp/desknx-confirmation-layout-test
          /tmp/desknx-confirmation-layout-test

      - name: Test shared Dialog, SidePanel and ContextMenu geometry
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/window_components_test.cpp -o /tmp/desknx-window-components-test
          /tmp/desknx-window-components-test

      - name: Test shared button and selectable-row component contracts
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/control_components_test.cpp -o /tmp/desknx-control-components-test
          /tmp/desknx-control-components-test

      - name: Test deterministic motion controller and reduced modes
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/motion_controller_test.cpp -o /tmp/desknx-motion-test
          /tmp/desknx-motion-test

      - name: Test semantic typography role tokens
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/typography_test.cpp -o /tmp/desknx-typography-test
          /tmp/desknx-typography-test

      - name: Test UTF-8 multiline text layout and truncation
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/text_layout_test.cpp -o /tmp/desknx-text-layout-test
          /tmp/desknx-text-layout-test

      - name: Test modal stack precedence and layer invariants
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/modal_stack_test.cpp -o /tmp/desknx-modal-stack-test
          /tmp/desknx-modal-stack-test

      - name: Test bounded runtime performance metrics
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/runtime_metrics_test.cpp -o /tmp/desknx-runtime-metrics-test
          /tmp/desknx-runtime-metrics-test

      - name: Test artwork request priority policy
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/artwork_request_policy_test.cpp -o /tmp/desknx-artwork-priority-test
          /tmp/desknx-artwork-priority-test

      - name: Test Nextendo presence snapshot and expiry rules
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/nextendo_players_test.cpp -o /tmp/desknx-nextendo-test
          /tmp/desknx-nextendo-test

      - name: Test hold-to-drag and page-swipe gestures
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/touch_gesture_test.cpp -o /tmp/desknx-touch-gesture-test
          /tmp/desknx-touch-gesture-test

      - name: Test HomeNX workspace projection adapter
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/homenx_workspace_projection_test.cpp -o /tmp/desknx-homenx-projection-test
          /tmp/desknx-homenx-projection-test

      - name: Test HomeNX grid focus adapter
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/homenx_grid_adapter_test.cpp -o /tmp/desknx-homenx-grid-adapter-test
          /tmp/desknx-homenx-grid-adapter-test

      - name: Test HomeNX independent workspace provider
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/homenx_workspace_provider_test.cpp source/Layout.cpp -o /tmp/desknx-homenx-provider-test
          /tmp/desknx-homenx-provider-test

      - name: Test HomeNX workspace file store and rollback
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Iprojects/common/include tests/homenx_workspace_file_store_test.cpp source/Layout.cpp -o /tmp/desknx-homenx-file-store-test
          /tmp/desknx-homenx-file-store-test

      - name: Test drag, resize and remove on the active desktop
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Iprojects/common/include tests/homenx_grid_edit_test.cpp source/Layout.cpp -o /tmp/desknx-homenx-grid-edit-test
          /tmp/desknx-homenx-grid-edit-test

      - name: Test persistence JSON round-trip without exceptions
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -Iinclude -Isource tests/persistence_store_test.cpp source/PersistenceStore.cpp -o /tmp/desknx-persistence-test
          /tmp/desknx-persistence-test

      - name: Build native standalone NRO
        run: |
          make -j2
          python3 scripts/check-nro-assets.py DeskNX.nro

      - name: Build native HOME library applet
        run: make -C projects/DeskNXMenu -j2

      - name: Prepare standalone SD-card package
        run: |
          mkdir -p dist/switch/DeskNX
          cp DeskNX.nro dist/switch/DeskNX/DeskNX.nro
          bash scripts/package-runtime-assets.sh dist/switch/DeskNX
          cp README.md dist/README-DeskNX.md

      - name: Upload native standalone NRO
        uses: actions/upload-artifact@v4
        with:
          name: DeskNX-native-nro
          path: DeskNX.nro
          if-no-files-found: error

      - name: Upload standalone SD-card package
        uses: actions/upload-artifact@v4
        with:
          name: DeskNX-sdcard
          path: dist/
          if-no-files-found: error

      - name: Upload HOME library applet build (not install-ready)
        uses: actions/upload-artifact@v4
        with:
          name: DeskNX-menu-applet
          path: |
            SdOut/switch/DeskNX/bin/Menu/main
            SdOut/switch/DeskNX/bin/Menu/main.npdm
          if-no-files-found: error
