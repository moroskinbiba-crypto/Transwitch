name: Build DeskNX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nintendo Switch homebrew
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DeskNX
        env:
          DEVKITPRO: /opt/devkitpro
        run: make -j2

      - name: Prepare SD-card package
        run: |
          mkdir -p dist/switch/DeskNX
          cp DeskNX.nro dist/switch/DeskNX/DeskNX.nro
          cp README.md dist/README-DeskNX.md

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: DeskNX-nro
          path: DeskNX.nro
          if-no-files-found: error

      - name: Upload SD-card package
        uses: actions/upload-artifact@v4
        with:
          name: DeskNX-sdcard
          path: dist/
          if-no-files-found: error
