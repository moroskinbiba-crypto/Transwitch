name: Build DeskNX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devkitPro packages
        uses: devkitPro/pacman@v1
        with:
          packages: >-
            switch-dev
            switch-sdl2

      - name: Build DeskNX
        run: make -j2

      - name: Prepare SD-card package
        run: |
          mkdir -p dist/switch/DeskNX
          cp DeskNX.nro dist/switch/DeskNX/DeskNX.nro
          cp README.md dist/README-DeskNX.md
          cd dist
          zip -r ../DeskNX-sdcard.zip .

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: DeskNX-nro
          path: DeskNX.nro
          if-no-files-found: error

      - name: Upload SD-card package
        uses: actions/upload-artifact@v4
        with:
          name: DeskNX-sdcard
          path: DeskNX-sdcard.zip
          if-no-files-found: error
