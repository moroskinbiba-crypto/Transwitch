name: Build DeskNX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DeskNX NRO and HOME applet
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: bash -n scripts/install-system.sh scripts/uninstall-system.sh tests/test-recovery.sh

      - name: Run host model, layout and catalog-view unit tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/model_test.cpp source/Layout.cpp source/catalog_view.cpp -o /tmp/desknx-model-test
          /tmp/desknx-model-test

      - name: Test install and recovery logic on a temporary fake SD card
        run: bash tests/test-recovery.sh

      - name: Build standalone Homebrew app
        env:
          DEVKITPRO: /opt/devkitpro
        run: make -j2

      - name: Build HOME library applet
        env:
          DEVKITPRO: /opt/devkitpro
        run: make -C projects/DeskNXMenu -j2

      - name: Prepare standalone SD-card package
        run: |
          mkdir -p dist/switch/DeskNX
          cp DeskNX.nro dist/switch/DeskNX/DeskNX.nro
          cp README.md dist/README-DeskNX.md

      - name: Upload standalone NRO
        uses: actions/upload-artifact@v4
        with:
          name: DeskNX-nro
          path: DeskNX.nro
          if-no-files-found: error

      - name: Upload standalone SD-card package
        uses: actions/upload-artifact@v4
        with:
          name: DeskNX-sdcard
          path: dist/
          if-no-files-found: error

      - name: Upload HOME library applet build (not install-ready)
        uses: actions/upload-artifact@v4
        with:
          name: DeskNX-menu-applet
          path: |
            SdOut/switch/DeskNX/bin/Menu/main
            SdOut/switch/DeskNX/bin/Menu/main.npdm
          if-no-files-found: error
