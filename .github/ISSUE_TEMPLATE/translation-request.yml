name: Suggest a translation
description: Suggest a fan translation for the Transwitch catalog
title: "[Translation] "
labels: ["translation-catalog"]
body:
  - type: input
    id: game
    attributes:
      label: Game title
      placeholder: Original or English title
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Target language
      placeholder: Russian, English, Ukrainian...
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Author's page or release
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Direct patch archive (optional)
      description: Must contain translation/mod files only, not a game dump.
      placeholder: https://...
  - type: input
    id: title_id
    attributes:
      label: Nintendo Switch Title ID
      placeholder: 0100000000000000
  - type: input
    id: game_version
    attributes:
      label: Required game version / update
  - type: textarea
    id: notes
    attributes:
      label: Compatibility, completeness, machine translation, and credits
    validations:
      required: true
